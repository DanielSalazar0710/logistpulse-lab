# ===== Perfil docker: stack completo (Postgres + Redis + RabbitMQ + WireMock) =====
spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:5432/${DB_NAME:logistpulse}
spring.datasource.username=${DB_USER:logistpulse}
spring.datasource.password=${DB_PASSWORD:logistpulse}

spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=10m

spring.rabbitmq.host=${RABBIT_HOST:rabbitmq}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

lab.messaging.enabled=true
# Parte 7.2: FLEET_AUTO_STARTUP=false levanta la API sin consumidor (los mensajes se acumulan en la cola)
lab.fleet.auto-startup=${FLEET_AUTO_STARTUP:true}
# Sin esto, un broker caído bloquea el relay del outbox hasta 60 s por intento
spring.rabbitmq.connection-timeout=2s
# Parte 7.5: tras el intento + 3 reintentos fallidos (en Boot 4 max-attempts cuenta reintentos) el mensaje va a la DLQ en lugar de reencolarse en bucle
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=500ms
spring.rabbitmq.listener.simple.default-requeue-rejected=false
lab.carrier.base-url=${CARRIER_URL:http://carrier-mock:8080}

management.health.redis.enabled=true
management.health.rabbit.enabled=true

# Parte 8.3: con Redis caído cada petición esperaba 60 s. Timeouts cortos + CacheConfig (error = cache-miss).
spring.data.redis.timeout=300ms
spring.data.redis.connect-timeout=300ms
# Liveness no depende de Redis/RabbitMQ: que una dependencia externa caiga no debe hacer que reinicien la API.
management.endpoint.health.probes.enabled=true
# Hikari espera la conexión 30 s por defecto; con la base caída es mejor fallar en 3 s (valor en ms)
spring.datasource.hikari.connection-timeout=3000
