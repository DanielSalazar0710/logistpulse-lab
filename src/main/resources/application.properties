# ===== Modo LITE (por defecto): H2 en memoria, sin Redis ni RabbitMQ =====
spring.application.name=logistpulse-lab
server.port=8080

# Jersey en la raíz: la API vive en /api/** y Actuator en /actuator/**
spring.jersey.application-path=/

# Datos
spring.datasource.url=jdbc:h2:mem:logistpulse;DB_CLOSE_DELAY=-1
# El esquema lo gobierna Flyway (db/migration/{vendor}); Hibernate solo valida que las entidades coincidan.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration/{vendor}
# Bases creadas antes con ddl-auto=update: se marcan como V1 y se aplican solo V2 en adelante.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false
# Parte 2: ponlo en true para contar las consultas (scripts/lab/parte2.sh). Lo dejo en false para no ensuciar el log.
spring.jpa.show-sql=${SHOW_SQL:false}

# Cache local, sin Redis
spring.cache.type=simple
spring.data.redis.repositories.enabled=false

# Mensajería desactivada: el evento solo se escribe en el log
lab.messaging.enabled=false

# Transportista externo (WireMock). Puedes levantar solo ese contenedor: docker compose up carrier-mock
lab.carrier.base-url=${CARRIER_URL:http://localhost:9091}

# Observabilidad
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.redis.enabled=false
management.health.rabbit.enabled=false
management.metrics.tags.application=logistpulse-lab
# Parte 8.4: histograma para calcular el p95 de latencia en Prometheus/Grafana
management.metrics.distribution.percentiles-histogram.http.server.requests=true
